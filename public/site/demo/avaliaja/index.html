<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AvaliaJá Demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
  /* Layout: shell do AvaliaJá (menu lateral no computador, abas roláveis no celular); telas trocadas por JS; pesquisa do cliente numa moldura de celular. */
  :root {
    --bg: #f3f4f8; --surface: #ffffff; --muted-bg: #eceef4; --line: #e2e4ec;
    --fg: #13151d; --muted: #5b6173; --accent: #4338ca; --accent-fg: #ffffff; --accent-soft: #e9e8fb;
    --promoter: #15803d; --promoter-bg: #e7f5ec; --passive: #b45309; --passive-bg: #fdf3e4;
    --detractor: #b91c1c; --detractor-bg: #fbeaea; --star: #f59e0b;
    --shadow: 0 1px 2px rgb(19 21 29 / 6%), 0 6px 18px rgb(19 21 29 / 5%);
    --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1016; --surface: #171a22; --muted-bg: #20232d; --line: #2b2f3b;
      --fg: #eceef4; --muted: #a2a8b9; --accent: #8b85f7; --accent-fg: #0e1016; --accent-soft: #25234a;
      --promoter: #4ade80; --promoter-bg: #13291c; --passive: #fbbf24; --passive-bg: #2d2412;
      --detractor: #f87171; --detractor-bg: #321717; --star: #fbbf24;
      --shadow: 0 1px 2px rgb(0 0 0 / 30%); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1016; --surface: #171a22; --muted-bg: #20232d; --line: #2b2f3b;
    --fg: #eceef4; --muted: #a2a8b9; --accent: #8b85f7; --accent-fg: #0e1016; --accent-soft: #25234a;
    --promoter: #4ade80; --promoter-bg: #13291c; --passive: #fbbf24; --passive-bg: #2d2412;
    --detractor: #f87171; --detractor-bg: #321717; --star: #fbbf24;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab { font-variant-numeric: tabular-nums; }
  .demo-bar { background: #3730a3; color: #ffffff; font-size: 13px; padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .demo-bar select { background: var(--surface); color: var(--fg); border: 0; border-radius: 6px; padding: 2px 6px; font-size: 13px; }
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 37px); }
  nav.side { border-right: 1px solid var(--line); background: var(--surface); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 0 10px 14px; }
  .logo span.mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: 16px; }
  .logo em { color: var(--accent); font-style: normal; }
  .nav-btn { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .nav-btn:hover { background: var(--muted-bg); color: var(--fg); }
  .nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .nav-btn .count { margin-left: auto; font-size: 11px; background: var(--detractor); color: #ffffff; border-radius: 99px; padding: 0 7px; }
  .nav-sep { height: 1px; background: var(--line); margin: 8px 4px; }
  .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 10px 4px; }
  main { padding-block: 26px 64px; padding-left: max(16px, min(40px, 4vw)); padding-right: max(16px, min(40px, 4vw)); min-width: 0; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .page-head h1 { font-size: 26px; letter-spacing: -.01em; }
  .page-head p { margin-top: 4px; color: var(--muted); max-width: 72ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g32 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .mt { margin-top: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
  .card h3, .card h2 { font-size: 15px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat .delta { font-size: 13px; }
  .up { color: var(--promoter); } .down { color: var(--detractor); }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn:hover { background: var(--muted-bg); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.danger { color: var(--detractor); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 500; background: var(--muted-bg); color: var(--muted); white-space: nowrap; }
  .badge.promoter { background: var(--promoter-bg); color: var(--promoter); }
  .badge.passive { background: var(--passive-bg); color: var(--passive); }
  .badge.detractor { background: var(--detractor-bg); color: var(--detractor); }
  .badge.accent { background: var(--accent-soft); color: var(--accent); }
  .score { width: 38px; height: 38px; border-radius: 99px; display: grid; place-items: center; font-weight: 600; flex: none; font-variant-numeric: tabular-nums; }
  .score.promoter { background: var(--promoter-bg); color: var(--promoter); }
  .score.passive { background: var(--passive-bg); color: var(--passive); }
  .score.detractor { background: var(--detractor-bg); color: var(--detractor); }
  .bars { display: grid; gap: 12px; }
  .bar-row .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; align-items: baseline; }
  .bar-row .top .l { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex-wrap: wrap; }
  .bar-track { height: 9px; background: var(--muted-bg); border-radius: 0 5px 5px 0; margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 0 5px 5px 0; background: var(--accent); }
  .bar-fill.promoter { background: var(--promoter); } .bar-fill.detractor { background: var(--detractor); } .bar-fill.passive { background: var(--passive); }
  .list { display: grid; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .row.click { cursor: pointer; text-align: left; width: 100%; }
  .row.click:hover { background: var(--muted-bg); }
  .row .grow { flex: 1; min-width: 180px; display: grid; gap: 2px; }
  .row .meta { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tabs button { border: 0; background: none; padding: 8px 12px; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
  .tabs button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
  label.field { display: grid; gap: 4px; font-size: 14px; font-weight: 500; }
  label.field .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  label.check input { margin-top: 4px; }
  input[type=text], input[type=date], input[type=email], input[type=password], input[type=number], input[type=url], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 80px; resize: vertical; }
  .form { display: grid; gap: 14px; max-width: 680px; }
  .form .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 9px 8px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data td.wrap { white-space: normal; }
  table.data thead th { border-top: 0; color: var(--muted); font-weight: 500; }
  table.data tr.click { cursor: pointer; } table.data tr.click:hover td { background: var(--muted-bg); }
  .scroll-x { overflow-x: auto; }
  .chart { width: 100%; min-height: 220px; }
  .chart svg { display: block; }
  .chart text { fill: var(--muted); font-family: var(--font); font-size: 12px; }
  .ruler { position: relative; height: 12px; background: var(--muted-bg); border-radius: 99px; margin-top: 10px; }
  .ruler .band { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); border-radius: 99px; }
  .ruler .med { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .7; }
  .ruler .me { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 99px; background: var(--accent); border: 2px solid var(--surface); transform: translate(-50%, -50%); }
  .ruler-l { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 4px; }
  dl.kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0 0; }
  dl.kv dt { color: var(--muted); font-size: 13px; } dl.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stars { color: var(--star); letter-spacing: 1px; } .stars .off { color: var(--line); }
  .reply { background: var(--muted-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: grid; gap: 6px; }
  .notice { border: 1px solid var(--line); background: var(--accent-soft); color: var(--fg); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .notice.warn { background: var(--passive-bg); }
  code.f { font-family: var(--mono); font-size: 12px; background: var(--muted-bg); padding: 8px; border-radius: 6px; display: block; overflow-x: auto; word-break: break-all; }
  .toast { position: fixed; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; z-index: 50; max-width: calc(100vw - 40px); }
  .verdict { font-weight: 600; font-size: 16px; }
  .timeline { display: grid; gap: 12px; border-left: 2px solid var(--line); padding-left: 14px; }
  .timeline div { font-size: 14px; } .timeline .when { color: var(--muted); font-size: 12px; }
  .progress { height: 8px; background: var(--muted-bg); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); }
  .steps { display: grid; gap: 8px; }
  .step { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .step .dot { width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; border: 1px solid var(--line); flex: none; }
  .step.done .dot { background: var(--promoter); color: #ffffff; border-color: var(--promoter); }
  .q { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--surface); }
  .q .qh { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .auth { min-height: calc(100vh - 37px); display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .auth .card { width: 100%; max-width: 420px; display: grid; gap: 14px; }
  .badge-card { border: 1px dashed var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--surface); }
  .qr { background: #ffffff; padding: 8px; border-radius: 8px; width: 148px; height: 148px; display: grid; place-items: center; }
  .qr img, .qr canvas { width: 132px !important; height: 132px !important; }
  /* Pesquisa do cliente */
  .phone-wrap { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 28px; align-items: start; }
  .phone { border: 10px solid var(--fg); border-radius: 34px; background: #ffffff; color: #13151d; overflow: hidden; max-width: 100%; }
  .phone .ph-head { background: #0f4c81; color: #ffffff; padding: 18px; font-weight: 600; }
  .phone .ph-body { padding: 18px; display: grid; gap: 16px; }
  .nps-scale { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
  .nps-scale button { border: 1px solid #d9dce5; background: #ffffff; color: #13151d; border-radius: 6px; padding: 8px 0; font-size: 13px; font-weight: 600; }
  .nps-scale button[aria-pressed="true"] { background: #0f4c81; color: #ffffff; border-color: #0f4c81; }
  .phone .chip { background: #ffffff; color: #13151d; border-color: #d9dce5; }
  .phone .chip[aria-pressed="true"] { background: #0f4c81; color: #ffffff; border-color: #0f4c81; }
  .phone textarea, .phone input, .phone select { background: #ffffff; color: #13151d; border: 1px solid #d9dce5; border-radius: 8px; padding: 8px; width: 100%; }
  .phone .send { background: #0f4c81; color: #ffffff; border: 0; border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; }
  .phone .send:disabled { opacity: .45; }
  .phone .gbtn { display: block; text-align: center; background: #1a73e8; color: #ffffff; border-radius: 10px; padding: 12px; font-weight: 600; text-decoration: none; }
  .ends { display: flex; justify-content: space-between; font-size: 11px; color: #5b6173; }
  /* Cores por perfil, ícones, entrada, TV e totem */
  :root { --c-owner: #4338ca; --c-owner-bg: #e9e8fb; --c-manager: #0f766e; --c-manager-bg: #ddf4f1; --c-attendant: #c2410c; --c-attendant-bg: #fdebdf; --tv-bg: #0b0d14; --tv-fg: #f4f5fa; --tv-muted: #9aa1b5; --tv-card: #161a26; --wa-bg: #e6ddd4; --wa-bubble: #ffffff; --wa-fg: #13151d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-owner: #a5a1fb; --c-owner-bg: #25234a; --c-manager: #5eead4; --c-manager-bg: #0f2f2c; --c-attendant: #fdba74; --c-attendant-bg: #3a2312; --wa-bg: #0b141a; --wa-bubble: #1f2c33; --wa-fg: #e9edef; } }
  :root[data-theme="dark"] { --c-owner: #a5a1fb; --c-owner-bg: #25234a; --c-manager: #5eead4; --c-manager-bg: #0f2f2c; --c-attendant: #fdba74; --c-attendant-bg: #3a2312; --wa-bg: #0b141a; --wa-bubble: #1f2c33; --wa-fg: #e9edef; }
  .ic { flex: none; }
  .nav-btn .ic { width: 17px; height: 17px; }
  .nav-group { display: contents; }
  .theme-btn { background: rgb(255 255 255 / 16%); color: inherit; border: 0; border-radius: 6px; padding: 3px 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .theme-btn:hover { background: rgb(255 255 255 / 26%); }
  .bar-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .role-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 10px 3px 4px; font-size: 12px; font-weight: 600; }
  .role-pill .ic { width: 20px; height: 20px; padding: 3px; border-radius: 99px; }
  .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .role-card { --c: var(--c-owner); --cb: var(--c-owner-bg); text-align: left; cursor: pointer; display: grid; gap: 14px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; position: relative; }
  .role-card:hover, .role-card:focus-visible { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 10px 30px rgb(19 21 29 / 12%); }
  .role-card.manager { --c: var(--c-manager); --cb: var(--c-manager-bg); }
  .role-card.attendant { --c: var(--c-attendant); --cb: var(--c-attendant-bg); }
  .role-card .icon { width: 56px; height: 56px; border-radius: 16px; background: var(--cb); color: var(--c); display: grid; place-items: center; }
  .role-card .icon .ic { width: 28px; height: 28px; }
  .role-card h2 { font-size: 20px; }
  .role-card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  .role-card li { display: flex; gap: 8px; } .role-card li::before { content: "✓"; color: var(--c); font-weight: 700; }
  .role-card .go { margin-top: 4px; display: inline-flex; justify-content: center; align-items: center; gap: 6px; background: var(--c); color: var(--surface); border-radius: 10px; padding: 11px 14px; font-weight: 600; }
  .insight { display: flex; gap: 14px; align-items: flex-start; }
  .insight .ib { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .medal { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; display: grid; gap: 4px; font-size: 13px; }
  .medal .m { font-size: 26px; } .medal.off { opacity: .45; filter: grayscale(1); }
  .wa { background: var(--wa-bg); border-radius: 12px; padding: 14px; }
  .wa .bubble { background: var(--wa-bubble); color: var(--wa-fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; max-width: 420px; white-space: pre-line; box-shadow: 0 1px 1px rgb(0 0 0 / 15%); }
  .post { background: linear-gradient(140deg, #0f4c81, #4338ca); color: #ffffff; border-radius: 16px; aspect-ratio: 1; max-width: 340px; width: 100%; padding: 28px; display: grid; align-content: space-between; }
  .post q { font-size: 20px; line-height: 1.35; font-weight: 600; }
  .seal { display: inline-flex; gap: 10px; align-items: center; border: 2px solid var(--accent); border-radius: 12px; padding: 10px 14px; background: var(--surface); }
  .seal strong { font-size: 22px; color: var(--accent); }
  .tv { min-height: 100vh; background: var(--tv-bg); color: var(--tv-fg); padding-block: 28px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; align-content: start; }
  .tv .tvc { background: var(--tv-card); border-radius: 18px; padding: 22px; }
  .tv .big { font-size: clamp(56px, 9vw, 120px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .tv .mut { color: var(--tv-muted); }
  .tv .rk { display: grid; gap: 10px; } .tv .rk div { display: flex; justify-content: space-between; gap: 10px; font-size: clamp(18px, 2.2vw, 28px); }
  .tv .quote { font-size: clamp(22px, 3vw, 40px); font-weight: 600; line-height: 1.3; }

    if (d.msuggest) { var all = mentions.reclame.concat(mentions.instagram), mm = byId(all, d.msuggest); document.getElementById("mr-" + mm.id).value = mm.text.indexOf("Amei") >= 0 ? "Que alegria, Carol! Vamos passar o recado para a Juliana. Obrigado pela indicação! 💙" : mm.text.indexOf("Demora") >= 0 || mm.text.indexOf("Demora muito") >= 0 ? "Oi, João! Agendando pelo nosso WhatsApp, a revisão sai no mesmo dia e você recebe aviso de cada etapa. Te esperamos!" : "Olá, " + mm.who.split(" ")[0] + ". Sentimos muito pelo atraso e pela falta de aviso. Já falamos com a equipe da oficina e vamos te ligar hoje para resolver."; return; }
    if (d.mreply) { var all2 = mentions.reclame.concat(mentions.instagram), m2 = byId(all2, d.mreply), tx = document.getElementById("mr-" + m2.id).value.trim(); if (tx.length < 2) return toast("Escreva a resposta."); m2.reply = tx; toast("Resposta publicada."); return render(); }
    if (d.tscore) { S.kiosk = S.kiosk || { reasons: [] }; S.kiosk.score = Number(d.tscore); S.kiosk.reasons = []; S.kiosk.done = false; return render(); }
    if (d.treason) { var kr = S.kiosk.reasons, ix2 = kr.indexOf(d.treason); if (ix2 >= 0) kr.splice(ix2, 1); else kr.push(d.treason); return render(); }
    if (d.pick) { S.role = d.pick; S.picked = true; document.getElementById("role").value = d.pick; return go(HOME[S.role]); }
    if (d.sector) { S.sectorF = d.sector; render(); return window.scrollTo(0, 0); }
    if (d.stacktab) { S.stackTab = d.stacktab; return render(); }

      var ck = document.getElementById("ck-" + d.sign), nm = document.getElementById("sg-" + d.sign).value.trim();
      if (!ck.checked) return toast("Marque que leu e está ciente.");
      if (nm.toLowerCase() !== "rafael costa") return toast("Digite seu nome completo (Rafael Costa) para assinar.");
      if (d.sign === "manual") manual.acks[ME] = Date.now(); else byId(feedbacks, d.sign).acks[ME] = Date.now();
      toast("Assinado. A liderança já vê que você leu."); return render();
    }
    if (d.act) return act(d.act, b);
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "role") { S.role = e.target.value; S.picked = true; S.view = HOME[S.role]; S.showNew = false; S.newColab = null; return render(); }

    if (e.target.id === "auto-sorry") { autoSorry = e.target.checked; return toast(autoSorry ? "Recuperação automática ligada." : "Recuperação automática desligada."); }
  });
  document.addEventListener("input", function (e) {

  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "colabform") {
      var nm = document.getElementById("nc-name").value.trim(); if (nm.length < 3) return toast("Informe o nome completo.");

      S.newColab = { name: nm, url: "https://avaliaja.com.br/r/PrmVnd3?p=" + id.slice(-6) }; S.showNew = false; toast("Perfil criado e link gerado."); return render();

    }
    if (e.target.id === "rwform") { readReward(); toast(reward.enabled ? "Premiação salva." : "Premiação desligada neste mês."); return render(); }
    if (e.target.id === "loginform") { S.logged = true; toast("Bem-vindo de volta!"); return render(); }

      var title = document.getElementById("np-title").value.trim(), theme = document.getElementById("np-theme").value.trim();

  });
  function readReward() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
    var on = document.getElementById("rw-on"); if (on) reward.enabled = on.checked;
    ["p0", "p1", "p2"].forEach(function (k, i) { if (g("rw-" + k) != null) reward.prizes[i] = Number(g("rw-" + k)) || 0; });
    if (g("rw-min") != null) reward.minResponses = Number(g("rw-min")) || 0;
    if (g("rw-mv") != null) reward.metaValue = Number(g("rw-mv")) || 0;
    if (g("rw-mn") != null) reward.metaNps = Number(g("rw-mn")) || 0;
    if (g("rw-sv") != null) reward.saveBonus = Number(g("rw-sv")) || 0;
    if (g("rw-cname") != null) { reward.campaignName = g("rw-cname"); reward.campaignEnd = g("rw-cend") || reward.campaignEnd; reward.campaignBonus = Number(g("rw-cbonus")) || 0; }
  }
  function keepPub() { var c = document.getElementById("pub-comment"), n = document.getElementById("pub-name"), a = document.getElementById("pub-att"); if (c) S.survey.comment = c.value; if (n) S.survey.name = n.value; if (a) S.survey.att = a.value; }
  function selectText(el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selecionado: use Ctrl+C para copiar."); }

  function act(a) {
    var r, p;

      case "forgot": return toast("Enviamos um link para redefinir a senha.");
      case "signup": S.logged = true; S.onboard = true; S.obStep = 1; return render();
      case "obnext": if ((S.obStep || 1) < 3) { S.obStep++; return render(); } S.onboard = false; S.picked = true; S.role = "owner"; toast("Tudo pronto! Sua pesquisa está ativa."); return go("painel");

      case "contactnow": r = byId(responses, S.id); r.status = "contacted"; r.events.push({ at: Date.now(), text: "Contato registrado por Wendell" }); toast("Contato registrado."); return render();
      case "wa": r = byId(responses, S.id); r.events.push({ at: Date.now(), text: "Mensagem enviada pelo WhatsApp oficial" }); r.status = "contacted"; toast("Mensagem enviada pelo WhatsApp."); return render();

      case "anon": r = byId(responses, S.id); r.name = "Cliente anônimo"; r.contact = null; r.phone = null; r.comment = ""; toast("Resposta anonimizada."); return render();
      case "delcustomer": responses.forEach(function (x) { if (x.name === S.id) { x.name = "Cliente anônimo"; x.contact = null; x.phone = null; } }); toast("Dados do cliente apagados."); return go("clientes");

      case "gsync": return toast("Avaliações atualizadas.");
      case "gdisc": return toast("Na versão real, isso desconecta o Google. Aqui mantivemos para você explorar.");
      case "profile": return toast("Perfil público: avaliaja.com.br/a/prime-veiculos/rafael");
      case "newsurvey": var nm = arguments[1] ? arguments[1].dataset.name : "Nova pesquisa"; var sv = { id: "v" + Date.now(), name: nm, slug: "PrmNov" + Math.floor(rnd() * 9), status: "Ativa", template: nm, sector: null, askAttendant: true, googleMin: 9, questions: ["De 0 a 10, quanto você recomendaria a Prime Veículos para um amigo?", "O que mais pesou na sua nota?"] }; surveys.unshift(sv); toast("Pesquisa criada a partir do modelo."); return go("pesquisa", sv.id);

      case "addq": sv = byId(surveys, S.id) || surveys[0]; sv.questions.push("Nova pergunta"); return render();
      case "pdf": return toast("Na versão real, o PDF é baixado aqui.");
      case "csv": return toast("Na versão real, a planilha CSV é baixada aqui.");

        toast(lines.length + (lines.length === 1 ? " convite criado." : " convites criados.")); return render();
      case "savedays": settings.inviteDays = Number(document.getElementById("inv-days").value); return toast("Frequência salva.");

      case "nope": return toast("Ação desativada na demonstração.");

      case "addatt": attendants.push({ id: "a" + Date.now(), name: "Novo consultor", sector: "s1", active: true }); toast("Consultor criado."); return render();
      case "push": return toast("Notificações ligadas neste aparelho (demonstração).");
      case "wadisc": settings.whatsapp.connected = false; toast("WhatsApp desconectado."); return render();
      case "waconn": settings.whatsapp.connected = true; toast("Número conectado."); return render();
      case "invite": var em = document.getElementById("inv-email").value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast("Informe um e-mail válido."); members.push({ id: "u" + Date.now(), name: em.split("@")[0] + " (convite enviado)", email: em, role: document.getElementById("inv-role").value, sectors: "Todos" }); toast("Convite enviado para " + em + "."); return render();
      case "saveterms": terms.sector = document.getElementById("tm-s").value || terms.sector; terms.sectors = document.getElementById("tm-ss").value || terms.sectors; terms.attendant = document.getElementById("tm-a").value || terms.attendant; terms.attendants = document.getElementById("tm-as").value || terms.attendants; CFG[2][1] = terms.attendants; toast("Terminologia salva."); return render();

    }
  }

  function currentTheme() { return document.documentElement.dataset.theme || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }

  try { var saved = localStorage.getItem("avaliaja-tema"); if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved; } catch (e) { /* sem armazenamento */ }
  document.getElementById("theme-btn").addEventListener("click", function () { var next = currentTheme() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next; try { localStorage.setItem("avaliaja-tema", next); } catch (e) { /* sem armazenamento */ } paintThemeBtn(); drawCharts(); });
  paintThemeBtn();
  var initial = (location.hash || "").slice(1);
  if (initial === "stack") S.view = "stack";

  render();
})();
