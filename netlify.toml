# Netlify: publica SOMENTE a landing (apps/landing). O sistema de gestão fica na Hostinger.
[build]
  base = "apps/landing"
  command = "npm run build"
  publish = ".next"
  # Só publica quando a landing mudou. Cada publicação consome créditos do plano; a maioria
  # dos envios ao repositório mexe apenas no sistema de gestão (que fica na Hostinger).
  # Na primeira publicação as duas referências são iguais: nesse caso publica sempre.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
