# Netlify: publica SOMENTE a landing (apps/landing). O sistema de gestão fica na Hostinger.
# A pasta de funções fica em branco no painel: quem gera as funções e o middleware é o runtime do Next.
[build]
  base = "apps/landing"
  command = "npm run build"
  publish = ".next"
  # Só publica quando a landing mudou. Cada publicação consome créditos do plano; a maioria
  # dos envios ao repositório mexe apenas no sistema de gestão (que fica na Hostinger).
  # Na primeira publicação as duas referências são iguais: nesse caso publica sempre.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Runtime do Next na Netlify: gera a função que serve as páginas e o middleware (endereços /c/<consultor>).
# Declarado aqui porque, neste projeto (pasta apps/landing), a Netlify não o ativou sozinha.
[[plugins]]
  package = "@netlify/plugin-nextjs"
